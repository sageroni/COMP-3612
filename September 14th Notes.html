<!--- this is how we can create a list in html that is not ordered-->

<ul>  
<li> item 1</li>
<li> item 2</li>
<li> <img src = a.jpg/></li>
</ul>

<!---ordered list example, and HTMl for one of the items!--->
<ol> 
    <li> item 1</li>
    <li> item 2</li>
    <li> item 3<a href = "https://wikipedia.org/wiki/HTML">HTML</a></li>
    <li> <img src = "a.png"alt = "10-Foot Flower Arrangement at the Las Vegas Bellagio"></li>
</ol>

<!---think of lists as a collection of content instead of a bulleted or numbered list
        Thinking of them this way focuses on identifying the semantics of the content, 
        and then using the appropriate elements to create the HTML structure. -->
